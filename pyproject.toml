[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heston-risk"
version = "0.1.0"
description = "Heston stochastic-volatility option pricing, calibration and options-portfolio risk"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "mpmath>=1.3"]
nn = ["torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: Monte Carlo cross-checks (a few seconds)"]
